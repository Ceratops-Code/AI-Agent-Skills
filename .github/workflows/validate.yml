name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install development validators
        run: |
          uv sync --project scripts --locked
          npm ci

      - name: Validate and test through SDLC
        uses: ./skills/ceratops-repo-lifecycle/scripts
        with:
          repo-root: .
          evidence-file: ${{ runner.temp }}/sdlc-validation.json

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          path: |
            ${{ runner.temp }}/sdlc-validation.json
            build/deploy-validation/repository-validation.log
            build/test-diagnostics/pytest-failure.json
