name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-skills-consistency:
    name: validate-skills-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Lint YAML
        run: python -m yamllint .

      - name: Type-check Python
        run: python -m mypy

      - name: Run tests
        run: python -m pytest -q

      - name: Validate repository source contracts
        run: python skills/ceratops-skill-lifecycle/scripts/skills-consistency-source-validator.py --mode full

      - name: Render managed skills transactionally
        run: python scripts/install-skills.py --install-root "${{ runner.temp }}/ceratops-skills"

      - name: Smoke-test repository lifecycle CLIs
        working-directory: skills/ceratops-repo-lifecycle/scripts
        run: |
          python promote-repository.py --help
          python manage-pending-work.py --help
          python run-deploy-operation.py --help
          python ship-repository.py --help
          python -m github_pr_workflow ship --help
          python -m github_contract_engine codeql-disposition --help
