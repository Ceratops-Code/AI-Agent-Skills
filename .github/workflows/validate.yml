name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: scripts/pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install development validators
        run: |
          uv sync --project scripts --locked
          npm ci

      - name: Validate repository
        run: >-
          python scripts/validate-repository.py
          --without-tests
          --evidence-file ${{ runner.temp }}/repository-validation.log

      - name: Run pull-request impact tests
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/testing/run-tests.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --diagnostic-output ${{ runner.temp }}/pytest-failure.json

      - name: Run full main-branch tests
        if: github.event_name == 'push'
        run: >-
          python scripts/testing/run-tests.py
          --all
          --diagnostic-output ${{ runner.temp }}/pytest-failure.json

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          path: |
            ${{ runner.temp }}/repository-validation.log
            ${{ runner.temp }}/pytest-failure.json
