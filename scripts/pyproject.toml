[project]
name = "ai-agent-skills-tooling"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "markdown-it-py==4.0.0",
  "mcp==2.1.1",
  "mypy==2.3.1",
  "packaging==26.3",
  "pytest==9.1.1",
  "ruff==0.16.5",
  "tzdata==2026.3",
  "yamllint==1.38.0"
]

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"

[tool.uv.workspace]
members = []
