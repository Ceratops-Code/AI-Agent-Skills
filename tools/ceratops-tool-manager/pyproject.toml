[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ceratops-tool-manager"
version = "0.2.3"
description = "Independent local tool packaging, installation, updates, and version inspection"
requires-python = ">=3.14,<3.15"
dependencies = ["mcp==2.1.1", "packaging==26.3"]

[project.scripts]
ceratops-tool-manager = "ceratops_tool_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ceratops_tool_manager"]
