[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ceratops_tool_manager"
version = "0.3.1"
description = "Independent local tool packaging, installation, updates, and version inspection"
requires-python = ">=3.14,<3.15"
dependencies = ["mcp==2.2.0", "packaging==26.3"]

[project.scripts]
ceratops_tool_manager = "ceratops_tool_manager.cli:main"

[tool.hatch.build.targets.wheel]
include = ["/*.py"]
exclude = ["/launcher.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "ceratops_tool_manager"
