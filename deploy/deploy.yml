version: 1
operations:
  after_promote:
    parameters:
      - base_revision
    steps:
      - id: type-check
        run:
          - python
          - -m
          - mypy
      - id: install-managed-skills
        run:
          - python
          - scripts/install-skills.py
          - --base-revision
          - "{base_revision}"
  after_ship:
    steps:
      - id: install-managed-skills
        run:
          - python
          - scripts/install-skills.py
