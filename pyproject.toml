[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
files = [
  "skills",
  "tests",
  "tools",
  "skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
