[project]
name = "ai-agent-skills"
# Metadata for the non-packaged development workspace, not a release version.
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
files = [
  "skills",
  "tests",
  "tools",
  "skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
