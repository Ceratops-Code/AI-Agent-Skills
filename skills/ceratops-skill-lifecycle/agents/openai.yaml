interface:
  display_name: "Ceratops Skill Lifecycle"
  short_description: "Create, adapt, update, and audit skills"
  icon_small: "./assets/ceratops-logo-500.png"
  icon_large: "./assets/ceratops-logo-500.png"
  default_prompt: "Use $ceratops-skill-lifecycle for this skill task. Select create, make-repo-compatible, update, skills-contract-review, or skills-consistency-review as the narrowest action, update the right source of truth, and hand repository promotion, deployment, or shipping to $ceratops-repo-lifecycle; new Ceratops skill creation in this repo uses promote-and-deploy unless opted out."
