interface:
  display_name: "Ceratops Skill Lifecycle"
  short_description: "Create, fast-change, update, and audit skills"
  icon_small: "./assets/ceratops-logo-500.png"
  icon_large: "./assets/ceratops-logo-500.png"
  default_prompt: "Use $ceratops-skill-lifecycle for this skill task. Prefer fast-change whenever its complete intended scope passes its action contract and deterministic readiness; otherwise select create, make-repo-compatible, update, skills-contract-review, or skills-consistency-review, update the right source of truth, and hand repository promotion, deployment, or shipping to $ceratops-repo-lifecycle."
