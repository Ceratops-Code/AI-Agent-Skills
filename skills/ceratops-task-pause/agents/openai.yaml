interface:
  display_name: "Ceratops Task Pause"
  short_description: "Pause execution with a resumable checkpoint"
  icon_small: "./assets/ceratops-logo-500.png"
  icon_large: "./assets/ceratops-logo-500.png"
  default_prompt: "Use $ceratops-task-pause to stop this execution at the next safe boundary and record the exact resume point."

policy:
  allow_implicit_invocation: false
