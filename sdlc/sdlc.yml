version: 3
kind: ceratops-sdlc

repository:
  prerequisites:
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python

    node:
      executable: node
      channel: lts
      includes: [npm]

    git:
      executable: git

    uv:
      executable: uv

    ripgrep:
      executable: rg

    powershell:
      executable: powershell
      platforms: [windows]

  bootstrap:
    runtime:
      prerequisites: [uv]
      steps:
        - run: [uv, sync, --project, scripts, --locked]

    development:
      prerequisites: [uv, node]
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        # Resolve npm.cmd on Windows and npm on other platforms.
        - run: [uv, run, --project, scripts, --locked, python, -c, "import shutil, subprocess; subprocess.run([shutil.which('npm'), 'ci'], check=True)"]

  test-selection:
    ci:
      parameters: [base, head]
      steps:
        - run: [uv, run, --locked, scripts/testing/run-tests.py, --select-only, --base, "{base}", --head, "{head}"]

  validate:
    repository:
      steps:
        - run: [uv, run, --locked, scripts/validate-repository.py]

  tests:
    all:
      steps:
        - run: [uv, run, --locked, scripts/testing/run-tests.py, --all]

deliverables:
  skills:
    validate:
      ceratops-managed:
        handoff: ceratops-skill-lifecycle/source-validate

    tests:
      none:
        no-op: >-
          No deliverable-specific test operation is declared; repository tests
          remain separately selectable.

    deploy-local:
      ceratops-managed:
        handoff: ceratops-skill-lifecycle/deploy

      standalone:
        steps:
          - run: [uv, run, --locked, scripts/deploy-skills.py]

  hooks:
    tests:
      none:
        no-op: >-
          No deliverable-specific test operation is declared; repository tests
          remain separately selectable.

    deploy-local:
      standalone:
        steps:
          - run: [uv, run, --locked, scripts/deploy-hooks.py]

  tools:
    tests:
      none:
        no-op: >-
          No deliverable-specific test operation is declared; repository tests
          remain separately selectable.

    deploy-local:
      ceratops-managed:
        handoff: ceratops-tool-lifecycle/install

      standalone:
        steps:
          - run: [uv, run, --locked, scripts/deploy-tool-manager.py]
